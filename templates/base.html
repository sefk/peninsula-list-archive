<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Peninsula list search{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --muted: #777; --accent: #2a6df4; --card: rgba(127,127,127,.1); }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 a { color: inherit; text-decoration: none; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input[name=q] { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--muted); border-radius: 8px; background: transparent; color: inherit; }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  a { color: var(--accent); }
  .result { margin-bottom: 22px; }
  .result h2 { font-size: 1.05rem; margin: 0; }
  .meta { color: var(--muted); font-size: .85rem; }
  .snip { margin: 4px 0 0; }
  mark { background: rgba(255, 210, 0, .45); color: inherit; border-radius: 2px; }
  .msg { background: var(--card); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
  .msg pre { white-space: pre-wrap; word-wrap: break-word; font: inherit; margin: 8px 0 0; }
</style>
</head>
<body>
<h1><a href="/">Peninsula list search</a></h1>
<form action="/" method="get">
  <input name="q" value="{{ q|default:'' }}" placeholder="e.g. recommendations for fencing companies" autofocus>
  <button>Search</button>
</form>
{% block content %}{% endblock %}
</body>
</html>
